<!DOCTYPE html>
<head>
    <title>Document</title>
    <style>
        .calc{
            height: 100px;
            width: 100px;
            background-color: red;
            position: relative;
            animation-duration: 3s;
            animation-name: box;
    
        }
        @keyframes box {
            0%{
                left: 0;
                top: 0;
            }
            
            25%{
                left: calc(100% - 200px);
                top: 0;
            }

            50%{
                left: calc(100% - 200px);
                top: calc(100% - 200px);
            }

            75%{
                left: 0;
                top: calc(100% - 200px);
            }
        
            100%{
            
                left: 0;
                top: 0;
            }
        }
    </style>
</head>
<body>
    <div class="calc"></div>
</body>
</html>
